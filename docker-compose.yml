services:
  postgres:
    image: postgres:16-alpine
    container_name: lunora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunora
      POSTGRES_PASSWORD: lunora
      POSTGRES_DB: lunora
    ports:
      - "5433:5432"
    volumes:
      - lunora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunora -d lunora"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lunora_pgdata:
